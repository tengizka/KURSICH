<html lang="ru">

<linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d2f1ff"/><stop offset=".55" stop-color="#7ed3fc"/><stop offset="1" stop-color="#48b2e6"/></linearGradient>
<linearGradient id="gOrange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb84d"/><stop offset=".55" stop-color="#ff9600"/><stop offset="1" stop-color="#dd7d00"/></linearGradient>

</defs></svg>
<div id="bg-scene" aria-hidden="true">
  <span class="bg-blob bb1"></span><span class="bg-blob bb2"></span><span class="bg-blob bb3"></span>
  <svg class="bg-chart" viewBox="0 0 400 170" preserveAspectRatio="none" aria-hidden="true"><path d="M0 150 L60 132 L120 140 L180 104 L240 112 L300 66 L360 44 L400 22 L400 170 L0 170 Z" fill="#58cc02" opacity=".07"/><path d="M0 150 L60 132 L120 140 L180 104 L240 112 L300 66 L360 44 L400 22" fill="none" stroke="#46a302" stroke-width="2.5" stroke-linecap="round" opacity=".28"/></svg>
