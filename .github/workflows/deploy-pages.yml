name: 🚀 Deploy КУРСИЧ to GitHub Pages

# Сайт автоматически пересобирается и публикуется при каждом пуше.
# Итоговый адрес мини-аппа: https://tengizka.github.io/KURSICH/
on:
  push:
    branches:
      - main
      - arena/b3bf7743-kursich
  workflow_dispatch: # можно запускать вручную во вкладке Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Не запускать два деплоя одновременно, но не отменять уже идущий
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build (Vite)
        run: npm run build

      - name: ⚙️ Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true # попытаться включить Pages с типом GitHub Actions, если ещё не включён

      - name: 📤 Upload site artifact (dist/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Страховка: пока в Settings → Pages источником стоит ветка (legacy),
      # GitHub параллельно собирает сырой репозиторий и может затереть сайт.
      # Ждём, пока та сборка закончится, и публикуем готовой версией поверх.
      # После переключения источника на "GitHub Actions" ожидание просто
      # добавит минуту к деплою, но ничему не мешает.
      - name: ⏳ Wait for possible legacy Pages build
        run: sleep 60

      - name: 🌍 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
